plugins {
    id 'java-test-fixtures'
}

dependencies {
	
	api project(':bff-api')
	api project(':api-srv-rest')
	implementation 'org.smartbit4all.platform:sec'
	testImplementation 'org.smartbit4all.platform:api'
	testImplementation testFixtures('org.smartbit4all.platform:api')
	testImplementation testFixtures('org.smartbit4all.platform:sec')
}

tasks.named('compileTestJava') {
	dependsOn(':api:compileTestFixturesJava')
	dependsOn(':sec:compileTestFixturesJava')
}

tasks.named('test') {
	dependsOn(':api:testFixturesJar')
	dependsOn(':sec:testFixturesJar')
}
