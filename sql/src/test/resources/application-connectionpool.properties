# Default
spring.datasource.url=jdbc:h2:mem:testdb;MODE=Oracle;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=3
spring.datasource.hikari.connection-timeout=10000
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.hikari.data-source-properties.oracle.jdbc.defaultConnectionValidation=LOCAL

# system
spring.system-datasource.url=jdbc:h2:mem:testdb;MODE=Oracle;DB_CLOSE_DELAY=-1
spring.system-datasource.username=sa
spring.system-datasource.password=
spring.system-datasource.hikari.maximum-pool-size=2
spring.system-datasource.hikari.minimum-idle=1
spring.system-datasource.hikari.pool-name=system-pool
spring.system-datasource.driver-class-name=org.h2.Driver

# lock
spring.lock-datasource.url=jdbc:h2:mem:testdb;MODE=Oracle;DB_CLOSE_DELAY=-1
spring.lock-datasource.username=sa
spring.lock-datasource.password=
spring.lock-datasource.hikari.maximum-pool-size=2
spring.lock-datasource.hikari.minimum-idle=1
spring.lock-datasource.hikari.pool-name=lock-pool
spring.lock-datasource.driver-class-name=org.h2.Driver

# system
spring.custom-datasource.url=jdbc:h2:mem:testdb;MODE=Oracle;DB_CLOSE_DELAY=-1
spring.custom-datasource.username=sa
spring.custom-datasource.password=
spring.custom-datasource.hikari.maximum-pool-size=1
spring.custom-datasource.hikari.pool-name=custom-pool
spring.custom-datasource.driver-class-name=org.h2.Driver
spring.custom-datasource.hikari.connection-timeout=1000