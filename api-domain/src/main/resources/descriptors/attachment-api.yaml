openapi: 3.0.1
info:
  title: Attachment api
  description: |
    The attachment api domain is strictly manages the BinaryContentData objects. They are responsible for a simple file with file name, location
    (represented by a dataUri) and a locationKind. The location defines the api that responsible for accessing the given content. It can be the storage
    inline but also any other document management system.
  termsOfService: ''
  contact:
    email: info@it4all.hu
  version: 1.0.0
tags:
  - name: Object
    description: Object
paths: {}
components:
  schemas:
    AttachmentList:
      type: object
      description: |
        A list of attached contents belongs to and an object.
      required: [uri, contents]
      properties:
        uri:
          type: string
          format: uri
        name:
          type: string
        contents:
          description: The inline list of the BinaryContentData (it is the the classic attachment).
          type: array
          items:
            $ref: '#/components/schemas/BinaryContentData'
    BinaryContentData:
      type: object
      description: |
        The binary content data represent a file with file name and other properties like size, mimetype and hash also. This can be used as
        contained inline object to have reference to a file (the dataUri) at a given location managed by the location handler api.
      required: [dataUri, fileName]
      properties:
        location:
          type: string
          description: The location is a type that can be managed by different APIs to access the given content.
        dataUri:
          type: string
          format: uri
        fileName:
          type: string
        created:
          type: UserActivityLog
        updated:
          type: UserActivityLog
        mimeType:
          type: string
        extension:
          type: string
        size:
          type: integer
          format: int64
        contentHash:
          type: string
        folderUri:
          type: string
          format: uri
    PhysicalObjectId:
      type: object
      description: |
        The physical object can be identified by several techniques lik barcode, QR code, NFC. This identifier can be used to search for the
        items by tha values
      required: [type, value]
      example:
        type: barcode
        value: '123456789012'
      properties:
        type:
          description: The type of identifier (e.g., barcode, QR code, NFC).
          $ref: '#/components/schemas/PhysicalObjectIdType'
        subType:
          type: string
          description: |
            The sub type of identifier like code128 in case of the barcode. It can be
            used to visalize the identifier and generate it.
        sequenceNr:
          type: integer
          format: int64
          description: The serial number the object id is based on.
        uniquePart:
          type: string
          description: The unique part of the identifier that can be used to save the given object.
        value:
          type: string
          description: The stringified value of the identifier.
    PhysicalObjectIdType:
      enum: [barcode, qrCode, nfc]
      description: |
        The physical object can be identified by several techniques lik barcode, QR code, NFC. This identifier can be used to search for the
        items by tha values

    DataExtractionDescriptor:
      type: object
      description: |
        A descriptor of a configurable subroutine which can extract structured data from a domain
        object, most likely an object holding a reference to a blob.
      properties:
        uri:
          type: string
          format: uri
          description: The unique persistent identifier of this descriptor
        identifier:
          type: string
          description: The unqiue logical identifier of this descriptor
        extractorFn:
          type: InvocationRequest
          description: |
            The invocation request performing the extraction. It should take an URI as its first and
            only argument, which identifies the domain object undergoing the data extraction. It
            should return with any type which is persistable in the object storage. Failed
            extractions should throw.
        targetPath:
          type: array
          items:
            type: string
          description: |
            The target path within the domain object where the extracted data should be persisted.
            Must be a valid, configured object reference path.
    DataExtraction:
      type: object
      description: |
        Describes the assigned data extraction operation to a given domain object, saved under a
        reserved key and scoped to the domain object itself.
      properties:
        created:
          type: UserActivityLog
          description: |
            The log when the extraction of the given logical identifier has been set for the host.
        updated:
          type: UserActivityLog
          description: |
            The log of the most recent data extraction operation.
        extractorId:
          type: string
          description: |
            The unique logical identifier of the extraction descriptor to be run on the host object.
