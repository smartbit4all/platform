openapi: 3.0.3
info:
  title: MasterDataManagement api
  description:
  termsOfService: ""
  contact:
    email: info@it4all.hu
  version: 1.0.0
tags:
  - name: MasterDataManagement
    description:
paths: {}
components:
  schemas:
    MDMDefinition:
      type: object
      description: |
        This definition object is a descriptor about the master data management in an application. Typically this is a single instance in the
        application but there can be more then one if we would like to manage separated set of data like in a multi tenant application. It is used as
        CollectionApi.reference to be able to identify by name.
      required: [uri, descriptors, templates]
      properties:
        uri:
          type: string
          format: uri
          description: The uri of the object.
        name:
          type: string
          description: The logical name of the given mdm definition. This is also the default name of the schema.
        adminGroupName:
          type: string
          description: |
            The name of the administration group. If a user is involved in the group then can administer all the entries inside the
            definition. The entries will have their own security group that will be included into this group, so we can manage all the entries one by one.
            It is mandatory to set this group name or else the master data management won't be able to setup the rights.
        adminApproverGroupName:
          type: string
          description: |
            The name of the administration approver group. Optional, if we don't set it then admin approver functionality won't be available.
        state:
          type: string
          format: uri
          description: The reference to the current state of the definition. It contains the necessary runtime informations.
        branchingStrategy:
          description: |
            Branching strategy of this MDMDefinition. This will be the default for all contained MDMEntityDescriptors,
            but can be overriden if needed. If not set, NONE will be used.
          $ref: "#/components/schemas/MDMBranchingStrategy"
        descriptors:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/MDMEntryDescriptor"
        templates:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/MDMEntryDescriptor"
        updateRequest:
          description: |
            Used for updating the master data inside the MDMDefinition.
          type: InvocationRequest
    MDMBranchingStrategy:
      type: string
      enum:
        - none
        - global
        - strict_parallel
    MDMEntryDescriptor:
      type: object
      description: |
        The entry is responsible for a managed list of object instances from the same kind. This contains every information about the behavior of
        the given list of object.
      required: [uri, tableColumns, state, listPageGridViews]
      properties:
        name:
          type: string
          description: |
            The name is the key of the given entry. The caption that is translated by the LocaleSettingApi. Normally it is filled with the
            qualified name of the given class. It is easy to identify in the message...properties.
        displayNameList:
          type: LangString
        displayNameForm:
          type: LangString
        order:
          description: |
            An arbitrary number, which can be used for any sorting, for example in Admin pages when managing entries.
          type: integer
          format: int64
        adminGroupName:
          type: string
          description: |
            The name of the administration group. Optional, if we don't set it then the group defined in the definition will be the master group for this
            entry. The security group of the entry is named like mdm.definition.entry.
        typeQualifiedName:
          type: string
          default: "org.smartbit4all.api.value.bean.GenericValue"
          description: |
            The type qualified name that is normally the name of the java class. It is used to identify the ObjectDefinition by name. By default the
            GenericValue object is used.
        publishedListName:
          type: string
          description: |
            Name of Collection.list in which published entries will be stored.
        inactiveMgmt:
          type: boolean
          default: true
          description: |
            The name of Collection.list in which the inactive entries will be stored is the list-inactive. If we set this true then the removal will save the
            removed item in this list. Else the removal is a final operation. This list is also managed in a branched way. So the inactive state is also branched.
        uniquePropertyPaths:
          type: array
          description: |
            The paths for the properties which should be unique in the handled objects. If this property is setted then maps generated to hold the unique values. Use the constraints property instead!
          items:
            type: array
            items:
              type: string
          deprecated: true
        constraints:
          type: array
          description: |
            The new or edited entryies should comply the constraints.
          items:
            $ref: "#/components/schemas/MDMEntryConstraint"
        tableColumns:
          type: array
          description: |
            The given object can be listed and can be searched. This mapping defines the table columns for the object. The columns can be
            hidden and the order is the default column order on the screen.
          items:
            $ref: "#/components/schemas/MDMTableColumnDescriptor"
        editorViewName:
          type: string
          description: The name of the view editor view to open. If empty then we use the default in the application.
        listPageGridViews:
          description: |
            The supported GridViews for presenting the MDM Entry List Page.
            If none are provided, all table columns are rendered. If more than one GridViews are 
            provided, it is the PageApi implementation's responsibility to provide actions for 
            switching between grid views.
          type: array
          items:
            type: GridView
        searchIndexForEntries:
          type: string
          description: The name of search index that provides the entries.
        schema:
          type: string
          description: |
            The schema for the objects to store them in. If it is null then the default schema from the MDMDefinition will be used.
        uriConstructor:
          type: InvocationRequest
          description: |
            It can be a function that produces the URI for the given object by the other property values.
        eventHandlersBeforeSave:
          type: array
          description: |
            These functions are event handlers to manage the save before event about the given object.
          items:
            type: InvocationRequest
        isValueSet:
          type: boolean
          default: false
          description: |
            Indicates if this entry is treated as a generic value set (it's not necessary for the type 
            to be a GenericValue, but usually it will be)
        branchingStrategy:
          $ref: "#/components/schemas/MDMBranchingStrategy"
        selfContainedRefList:
          type: string
          description: |
            The name of the self contained reference list like children list. It is used to recurse on the object nodes if a complex 
            hierarchy is saved via the MDMEntryApi.
        vectorCollection:
          type: VectorCollectionDescriptor
          description: |
            The Vector collection managed by the MDM Entry. It is maintained for the published object in the given entry. The under construction
            state is not working.
        propertyMappings:
          description: |
            This mapping contains all predefined property name mappings used by MDMEntryApi. For example you can specify which property will 
            be used as created, updated, approved (these are all UserActivityLog types). If empty, default property names will be used, 
            this is only a possibility to specify non-default properties.
          type: string
          additionalProperties:
            type: string
        filterModel:
          description: "If null, the list cannot be searched in published mode, and there are no filters."
          type: FilterExpressionBuilderModel
        filterModelAdmin:
          description: "if null, but filterModel is present, filterModel is applied."
          type: FilterExpressionBuilderModel
        importable:
          description: Tells if the records in the entry are importable from a file or not.
          type: boolean
          default: false
        hidden:
          description: This flag decides it the described entry could be edited on the ui.
          type: boolean
          default: false
        displayNamePropertyPath:
          type: array
          items:
            type: string
        editorParameters:
          description: A set of parameters passed to the editor page of the entry.
          type: object
          additionalProperties: true
    MDMTableColumnDescriptor:
      type: object
      description: |
        This definition object is a descriptor about the master data management in an application. Typically this is a single instance in the
        application but there can be more then one if we would like to manage separated set of data like in a multi tenant application. It is used as
        CollectionApi.reference to be able to identify by name.
      required: [name]
      properties:
        name:
          type: string
          description: The name of the given column.
        aspectName:
          type: string
          description: The name of the aspect object to extract.
        typeClass:
          type: string
          description: The given column's type's class name.
        path:
          type: array
          description: The path to access the object property of the column.
          items:
            type: string
    MDMDefinitionState:
      type: object
      description: |
        This definition object is a descriptor about the master data management in an application. Typically this is a single instance in the
        application but there can be more then one if we would like to manage separated set of data like in a multi tenant application. It is used as
        CollectionApi.reference to be able to identify by name.
      required: [uri, activeModifications]
      properties:
        uri:
          type: string
          format: uri
          description: The uri of the object.
        globalModification:
          description: |
            The global branch modification if the branchng startegy is global. If it is active then there shouldn't be any
            item in the active modification list.
          $ref: "#/components/schemas/MDMModification"
        activeModifications:
          description: |
            The active modification list is used if the branchng startegy is paralel (strict or whatever). If it is not empty then
            the global modification should be empty.
          type: array
          items:
            $ref: "#/components/schemas/MDMModification"
        archive:
          description: |
            This is a reference to the archived object. It refers always to the last archived modification and
            it is set when the a new modification is archived from the active modification list.
          type: string
          format: uri
    MDMModification:
      type: object
      description: |
        This object represents an ongoing modification in an MDMDefinition. It is strored inline in 
        the MDMDefinitionState, and may be global, entry or group level (just like BranchingStrategy).
      required: [descriptors, templates, currentEditors]
      properties:
        id:
          description: |
            A unique identifier generated for the modification when it is created. It is used to identify the
            modification package and refer this. It is uuid or a monoton increasing number to identify the modification.
          type: string
        name:
          description: |
            The human readable nam of the modification. It should be unique among the current active modifications.
          type: string
        description:
          description: |
            The detailed description of the modification.
          type: string
        branchUri:
          type: string
          format: uri
        created:
          type: UserActivityLog
        updated:
          type: UserActivityLog
        currentEditors:
          description: |
            The current editors are the users working actively on the modification. For this a user must start the
            editing actively on the UI. After this the editing should be finished. If the editing is active then the user
            can see the editing state of the given modification. There can be only one modification where the given user is
            editor in a moment.
          type: array
          items:
            type: string
            format: uri
        sentToApproval:
          description: |
            When the modification is sent to approval then this object is set to see who and when has been sent to
            approval.
          type: UserActivityLog
        approver:
          type: string
          format: uri
        approved:
          description: |
            When the modification is approved by the approver and result is set.
          type: UserActivityLog
        state:
          description: |
            The state of the modification. During the active phase the active, editing, approving, approved, rejected
            state is the valid. If we set the disposed then the modification is cancelled, disposed so it will be moved 
            into the  archival immediately. If the final state is rejected or approved then the modification canb be moved 
            into the archival also to see the proper final state.
          $ref: "#/components/schemas/MDMModificationState"
        notes:
          type: list
          items:
            $ref: "#/components/schemas/MDMModificationNote"
        descriptors:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/MDMEntryDescriptor"
        templates:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/MDMEntryDescriptor"
        modificationItems:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/MDMModificationItem"
    MDMModificationItem:
      description: |
        This inline object is hold information about modification state and notes to one entry.
      type: object
      properties:
        objectUri:
          type: string
          format: uri
        state:
          type: string
          enum: [APPROVED, REJECTED, FIXED]
        notes:
          type: array
          items:
            $ref: "#/components/schemas/MDMModificationNote"
    MDMModificationNote:
      description: |
        This inline object is the comment on the MDM modification. It can be global for the whole notification and
        can refer tor an entry or even an object in an entry. The objet is a bit tricky because we can refer the object
        by the branched and the original uri also.
      type: object
      properties:
        created:
          type: UserActivityLog
        note:
          type: string
        entry:
          description: |
            The name of the entry the note is refering to.
          type: string
        objectUri:
          description: |
            The object URI the note is refering to.
          type: string
          format: uri
    MDMModificationState:
      enum: [active, disposed, approving, approved, rejected]
    MDMModificationArchive:
      type: object
      description: |
        This object is a history object that is saved when a modification is archived from the active modification list.
        The archived
      properties:
        uri:
          type: string
          format: uri
          description: The uri of the object.
        modification:
          description: |
            The modification that was archived from the active modification list.
          $ref: "#/components/schemas/MDMModification"
        archival:
          description: The user and the time of the archival.
          type: UserActivityLog
    MDMEntryEditingObject:
      type: object
      description: |
        A generic object to use as the editing object for the master data management page apis. The list page constructs
        this object and pass to the editor page. When saving the editing the list can decide what to do.
      required: [uri, created, objects]
      properties:
        branchObjectEntry:
          type: BranchedObjectEntry
          description: The BranchedObjectEntry that is the original data we have.
        originalObject:
          type: object
          description: The original object loaded if any.
        branchedObject:
          type: object
          description: The branched object loaded if any.

    MDMModificationRequest:
      type: object
      description: .
      required: [uri, data]
      properties:
        uri:
          type: string
          format: uri
          description: The uri of the object.
        data:
          description: .
          $ref: "#/components/schemas/MDMModificationRequestData"
    MDMModificationRequestData:
      type: object
      description: .
      properties:
        definition:
          type: array
          items:
            type: object
            additionalProperties:
              type: string

    MDMErrorLog:
      type: object
      description: Import and export operation error log.
      required: [uri, data]
      properties:
        uri:
          type: string
          format: uri
          description: The uri of the object.
        data:
          type: array
          items:
            $ref: "#/components/schemas/MDMErrorLogData"
    MDMErrorLogData:
      type: object
      description: Import and export operation error log data.
      properties:
        rowNum:
          type: integer
        column:
          type: string
        error:
          type: string
    MDMEntryConstraint:
      type: object
      required: [kind, path]
      properties:
        kind:
          type: string
          enum:
            - UNIQUE
            - UNIQUECASEINSENSITIVE
        path:
          type: array
          items:
            type: string
    ApplicationSetupKind:
      enum: [API, INVOCATION]
    ApplicationSetup:
      type: object
      required: [kind, path]
      properties:
        uri:
          type: string
          format: uri
        data:
          description: |
            The data of the application setup.
          $ref: "#/components/schemas/ApplicationSetupData"
    ApplicationSetupData:
      type: object
      required: [kind, name]
      properties:
        kind:
          $ref: "#/components/schemas/ApplicationSetupKind"
          default: "API"
        name:
          description: |
            The unique name of the application setup.
          type: string
        preRequisites:
          description: |
            The names of the setups that are pre requisites of the current one. The setups should be ordered
            based on this dependencies.
          type: array
          items:
            type: string

    MDMDefinitionChange:
      description: |
        The change entry is created and updated for every MDMDefinition as scoped object. Th URI is computed from the uri of
        the definition. At every change of the given definition this object is updated with the current change. The chenge denotes
        the modified entries and contains the list of changes. There can be objects added to the entry when we point the version uri
        of the newly added object. If an existing object was modifed then we get the previous versuion uri and the new one also. In case
        of inactivation we get the uri to remove. The change entry history itself shows the modification history of the given definition.
        The definition should be instructed to produce this change history.
      type: object
      required: [uri]
      properties:
        uri:
          type: string
          format: uri
        entries:
          description: |
            The entries with their changes.
          type: array
          items:
            $ref: "#/components/schemas/MDMEntryChange"
    MDMEntryChange:
      description: |
        The entry change contains all the changeed items of an MDMEntry.
      type: object
      required: [entry, items]
      properties:
        entry:
          description: The name of the entry
          type: string
        items:
          description: The chnages items of the entry.
          type: array
          items:
            $ref: "#/components/schemas/MDMEntryChangeItem"
    MDMEntryChangeItem:
      description: |
        The change item defines the operation and refers to the related versioned uris of the chnaged object.
      type: object
      required: [operation]
      properties:
        operation:
          description: The operation of the change. Could be NEW, MODIFIED, INACTIVATED, REACTIVATED.
          $ref: "#/components/schemas/MDMEntryChangeOperation"
        uri:
          description: |
            The uri refers to the actual state of the new or changed object. It is versioned object uri points to
            the exact version of the object.
          type: string
          format: uri
        prevUri:
          description: The uri refers to the previous state of the new or changed object. Set only in case of change.
          type: string
          format: uri
    MDMEntryChangeOperation:
      enum: [NEW, MODIFIED, INACTIVATED, REACTIVATED]